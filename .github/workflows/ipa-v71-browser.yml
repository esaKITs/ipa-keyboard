name: IPA vowel highlight v71 browser verification
on:
  push:
    branches: [fix/v71-vowel-highlight-validation]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node .github/tests/vowel-highlight.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vowel-highlight-screenshots
          path: test-artifacts/
