<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>B-2 IPA Keyboard iPhone Test</title><style>body{font-family:-apple-system,sans-serif;margin:0;padding:16px;background:#f3f3f1}main{max-width:700px;margin:auto}textarea{box-sizing:border-box;width:100%;min-height:110px;font:32px/1.4 "Times New Roman",serif;padding:10px;background:#fff}.keys{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.key{touch-action:none;-webkit-user-select:none;user-select:none;min-width:60px;min-height:60px;border:1px solid #777;border-radius:8px;background:#fff;font:30px "Times New Roman",serif}.key.pressed{background:#0a84ff;color:#fff}.pop{position:fixed;display:none;z-index:10;min-width:64px;height:68px;align-items:center;justify-content:center;background:#fff;border:1px solid #777;border-radius:12px;box-shadow:0 5px 18px #0004;font:42px "Times New Roman",serif;pointer-events:none;transform:translate(-50%,-100%)}.pop.show{display:flex}#warning{margin-top:14px;min-height:24px}</style></head><body><main><h1>B-2 IPA Keyboard</h1><p>iPhone Safari 入力動作確認</p><textarea id="out" spellcheck="false"></textarea><div class="keys"><button class="key" data-sym="p">p</button><button class="key" data-sym="b">b</button><button class="key" data-sym="n">n</button><button class="key" data-sym="a">a</button><button class="key" data-sym="̥">̥</button><button class="key" data-sym="̃">̃</button><button class="key" data-sym="t͡s">t͡s</button><button class="key" data-sym="ŋ">ŋ</button></div><div id="warning" aria-live="polite"></div><div id="pop" class="pop"></div></main><script>(function(){"use strict";var out=document.getElementById("out"),pop=document.getElementById("pop"),warning=document.getElementById("warning"),savedStart=0,savedEnd=0,active=null,suppress=0;function remember(){savedStart=typeof out.selectionStart==="number"?out.selectionStart:out.value.length;savedEnd=typeof out.selectionEnd==="number"?out.selectionEnd:savedStart}["focus","click","keyup","select","input"].forEach(function(ev){out.addEventListener(ev,remember)});function insert(sym){var a=Math.min(savedStart,out.value.length),b=Math.min(savedEnd,out.value.length),before=out.value.slice(0,a);if(sym==="̥"&&/[ptkcqfsʃxχh]$/.test(before))warning.textContent="無声子音に無声化記号が付いています。確認してください。";else warning.textContent="";out.focus();out.setSelectionRange(a,b);out.setRangeText(sym,a,b,"end");remember()}function show(btn){var r=btn.getBoundingClientRect();pop.textContent=btn.dataset.sym;pop.style.left=(r.left+r.width/2)+"px";pop.style.top=Math.max(78,r.top-8)+"px";pop.classList.add("show")}function clear(btn){btn.classList.remove("pressed");pop.classList.remove("show");if(active===btn)active=null}document.querySelectorAll(".key").forEach(function(btn){btn.addEventListener("touchstart",function(e){e.preventDefault();remember();active=btn;btn.classList.add("pressed");show(btn)},{passive:false});btn.addEventListener("touchend",function(e){e.preventDefault();if(active===btn)insert(btn.dataset.sym);clear(btn);suppress=Date.now()+700},{passive:false});btn.addEventListener("touchcancel",function(){clear(btn);suppress=Date.now()+700},{passive:false});btn.addEventListener("click",function(e){e.preventDefault();if(Date.now()<suppress)return;remember();insert(btn.dataset.sym)})});remember()})();</script></body></html>
