name: Verify and publish IPA Keyboard production v83.34
on:
  push:
    branches: [main, release/ipa-keyboard-v83.34, work/header-alignment-20261119, work/tap-feedback-20261119, work/seo-20261119, work/desktop-zoom-20261120, work/live-desktop-zoom-20261120]
    paths: ['index.html', 'sitemap.xml', 'chart.html', 'i18n.js', 'translations.csv', 'translations.xlsx', 'sw.js', 'ipa-fonts.js', 'editor-gestures.js', 'diacritic-display.js', 'language-picker.js', 'fonts/**', 'qa/**', 'tools/**', '.github/workflows/release-production.yml']
  workflow_dispatch:
permissions:
  contents: read
# WPE Skia CPU rasterization avoids cold software-GPU stalls on GPU-less CI.
# Application cold-load sequencing and every performance assertion remain unchanged.
env:
  WEBKIT_SKIA_ENABLE_CPU_RENDERING: '1'
concurrency:
  group: ipa-production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/work/desktop-zoom-20261120' || github.ref == 'refs/heads/release/ipa-keyboard-v83.34' || github.ref == 'refs/heads/work/header-alignment-20261119' || github.ref == 'refs/heads/work/tap-feedback-20261119' || github.ref == 'refs/heads/work/seo-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check translation master
        run: python3 tools/export-translations.py translations.xlsx translations.csv --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1 pngjs@7.0.0
      - run: npx playwright install chromium webkit --with-deps
      - name: Serve at the production path
        run: nohup python3 qa/server.py >/tmp/ipa-production-http.log 2>&1 &
      - name: Serve immutable geometry reference
        run: |
          git fetch --depth=1 origin a389cb2c9f6cae3b00ef75a4795c8aa53bdb858b
          mkdir -p /tmp/ipa-vowel-reference
          git archive a389cb2c9f6cae3b00ef75a4795c8aa53bdb858b | tar -x -C /tmp/ipa-vowel-reference
          nohup python3 -m http.server 8771 --bind 127.0.0.1 --directory /tmp/ipa-vowel-reference >/tmp/ipa-vowel-reference.log 2>&1 &
      - name: Serve immutable SEO baseline
        if: github.ref == 'refs/heads/work/seo-20261119' || contains(github.event.head_commit.message, '[seo]')
        run: |
          git fetch --depth=1 origin 3922bb8b4b2b42307680b41f9e5d77e67e7571fc
          mkdir -p /tmp/ipa-seo-reference/ipa-keyboard
          git archive 3922bb8b4b2b42307680b41f9e5d77e67e7571fc | tar -x -C /tmp/ipa-seo-reference/ipa-keyboard
          nohup python3 -m http.server 8772 --bind 127.0.0.1 --directory /tmp/ipa-seo-reference >/tmp/ipa-seo-reference.log 2>&1 &
      - name: Serve desktop zoom baseline and reproduce missing handlers
        if: github.ref == 'refs/heads/work/desktop-zoom-20261120'
        run: |
          git fetch --depth=1 origin 368de87ec2a223f048bd73241e51c1074f2f3c07
          mkdir -p /tmp/ipa-zoom-reference/ipa-keyboard
          git archive 368de87ec2a223f048bd73241e51c1074f2f3c07 | tar -x -C /tmp/ipa-zoom-reference/ipa-keyboard
          nohup python3 -m http.server 8773 --bind 127.0.0.1 --directory /tmp/ipa-zoom-reference >/tmp/ipa-zoom-reference.log 2>&1 &
      - name: Verify desktop zoom anchors and native slider
        if: github.ref == 'refs/heads/work/desktop-zoom-20261120'
        env:
          ZOOM_BASELINE_URL: http://127.0.0.1:8773/ipa-keyboard/
        run: node qa/desktop-zoom.cjs
      - name: Verify cold panel responsiveness
        run: node qa/panel-controls.cjs
      - name: Verify SEO metadata and exact visual equivalence
        if: github.ref == 'refs/heads/work/seo-20261119' || contains(github.event.head_commit.message, '[seo]')
        run: |
          python3 qa/seo-static.py
          node qa/seo.cjs
      - name: Verify recovery behavior and single restore control
        run: |
          node qa/vowel-equivalence.cjs
          node qa/header-alignment.cjs
          node qa/tap-feedback.cjs
          node qa/final-four.cjs
          node qa/recovery.cjs
          node qa/editor-gestures.cjs
          node qa/viewer-icons.cjs
      - name: Verify production assets and upgrade from old offline cache
        run: node qa/production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-production-staged-screenshots
          path: qa-production/
  public:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/live-desktop-zoom-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1 pngjs@7.0.0
      - run: npx playwright install chromium webkit --with-deps
      - name: Wait for GitHub Pages and compare public assets
        shell: python
        run: |
          import urllib.request, pathlib, time
          files=['index.html','sitemap.xml','chart.html','i18n.js','translations.csv','ipa-fonts.js','sw.js','fonts/Andika-Regular.woff2','fonts/ipa-font-coverage.json','CREDITS.md','LICENSE-MIT.txt','editor-gestures.js','diacritic-display.js','language-picker.js','fonts/positioned-diacritics.json']
          for attempt in range(36):
              try:
                  for name in files:
                      request=urllib.request.Request('https://esakits.github.io/ipa-keyboard/'+name+'?release='+str(attempt),headers={'Cache-Control':'no-cache'})
                      actual=urllib.request.urlopen(request,timeout=10).read()
                      assert actual==pathlib.Path(name).read_bytes(), name
                  print('Public production files match this commit exactly')
                  break
              except Exception as error:
                  print('Waiting for Pages:',str(error))
                  time.sleep(5)
          else:
              raise SystemExit('Production files did not update')
      - name: Serve immutable geometry reference
        run: |
          git fetch --depth=1 origin a389cb2c9f6cae3b00ef75a4795c8aa53bdb858b
          mkdir -p /tmp/ipa-vowel-reference
          git archive a389cb2c9f6cae3b00ef75a4795c8aa53bdb858b | tar -x -C /tmp/ipa-vowel-reference
          nohup python3 -m http.server 8771 --bind 127.0.0.1 --directory /tmp/ipa-vowel-reference >/tmp/ipa-vowel-reference.log 2>&1 &
      - name: Serve immutable SEO baseline
        if: contains(github.event.head_commit.message, '[seo]')
        run: |
          git fetch --depth=1 origin 3922bb8b4b2b42307680b41f9e5d77e67e7571fc
          mkdir -p /tmp/ipa-seo-reference/ipa-keyboard
          git archive 3922bb8b4b2b42307680b41f9e5d77e67e7571fc | tar -x -C /tmp/ipa-seo-reference/ipa-keyboard
          nohup python3 -m http.server 8772 --bind 127.0.0.1 --directory /tmp/ipa-seo-reference >/tmp/ipa-seo-reference.log 2>&1 &
      - name: Verify the live production URL in both browsers
        env:
          APP_URL: https://esakits.github.io/ipa-keyboard/
          PUBLIC_CHECK: '1'
        run: |
          node qa/desktop-zoom.cjs
          node qa/panel-controls.cjs
          node qa/vowel-equivalence.cjs
          node qa/header-alignment.cjs
          node qa/tap-feedback.cjs
          node qa/final-four.cjs
          node qa/recovery.cjs
          node qa/editor-gestures.cjs
          node qa/viewer-icons.cjs
          node qa/production.cjs
      - name: Verify public SEO and exact visual equivalence
        if: contains(github.event.head_commit.message, '[seo]')
        env:
          APP_URL: https://esakits.github.io/ipa-keyboard/
          PUBLIC_CHECK: '1'
        run: |
          python3 qa/seo-static.py
          node qa/seo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-production-public-screenshots
          path: qa-production/
