name: Settings reset verification (no publication)
on:
  push:
    branches: [work/settings-reset-20261127]
permissions:
  contents: read
env:
  WEBKIT_SKIA_ENABLE_CPU_RENDERING: '1'
concurrency:
  group: settings-reset-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [settings, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1 pngjs@7.0.0
      - run: npx playwright install chromium webkit --with-deps
      - name: Check source and translation master
        run: |
          git -c core.whitespace=cr-at-eol diff --check 391cd42bca752c4772e0e9c77345a25881210401 HEAD
          node --check qa/settings-reset.cjs
          python3 tools/export-translations.py translations.xlsx translations.csv --check
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          for i,(attrs,s) in enumerate(re.findall(r'<script\b([^>]*)>(.*?)</script>',Path('index.html').read_text(),re.S)):
              if 'application/ld+json' in attrs: continue
              p=Path('/tmp/settings-inline-'+str(i)+'.js');p.write_text(s);subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Serve candidate
        run: nohup python3 qa/server.py >/tmp/settings-http.log 2>&1 &
      - name: Verify reset in both browsers and all settings languages
        if: matrix.suite == 'settings'
        run: node qa/settings-reset.cjs
      - name: Verify panel gestures, input, zoom and theme
        if: matrix.suite == 'regression'
        run: |
          node qa/panel-controls.cjs
          node qa/editor-gestures.cjs
          node qa/tap-feedback.cjs
          node qa/final-four.cjs
          node qa/viewer-icons.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-reset-${{ matrix.suite }}-evidence
          path: qa-production/
