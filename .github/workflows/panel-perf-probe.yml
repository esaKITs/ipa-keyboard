name: Diagnose public WebKit slider response
on:
  push:
    branches: [work/panel-perf-probe-20261118]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        isolate: [system, doulos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install webkit --with-deps
      - run: node qa/minimal-font-probe.cjs
        env:
          ISOLATE: ${{ matrix.isolate }}
