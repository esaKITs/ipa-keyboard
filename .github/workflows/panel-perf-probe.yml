name: Diagnose public WebKit slider response
on:
  push:
    branches: [work/panel-perf-probe-20261118]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [normal, noatbridge, nojit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install webkit --with-deps
      - run: node qa/perf-probe.cjs
        env:
          ISOLATE: none
          DEBUG: pw:browser
          NO_AT_BRIDGE: ${{ matrix.engine == 'noatbridge' && '1' || '0' }}
          JSC_useJIT: ${{ matrix.engine == 'nojit' && 'false' || 'true' }}
          JSC_reportCompileTimes: 'true'
          JSC_logGC: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-slider-performance-trace-${{ matrix.engine }}
          path: qa-production/
