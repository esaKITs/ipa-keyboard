name: Diagnose public WebKit slider response
on:
  push:
    branches: [work/panel-perf-probe-20261118]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        renderer: [normal, no-compositing, softpipe, limited-llvmpipe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install webkit --with-deps
      - run: node qa/perf-probe.cjs
        env:
          ISOLATE: none
          DEBUG: pw:browser
          WEBKIT_DISABLE_COMPOSITING_MODE: ${{ matrix.renderer == 'no-compositing' && '1' || '0' }}
          GALLIUM_DRIVER: ${{ matrix.renderer == 'softpipe' && 'softpipe' || 'llvmpipe' }}
          LP_NUM_THREADS: ${{ matrix.renderer == 'limited-llvmpipe' && '2' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-slider-performance-trace-${{ matrix.renderer }}
          path: qa-production/
