name: Lucide toolbar icons verification (no publication)
on:
  push:
    branches: [work/lucide-icons-20261128]
permissions:
  contents: read
env:
  WEBKIT_SKIA_ENABLE_CPU_RENDERING: '1'
concurrency:
  group: lucide-icons-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1 pngjs@7.0.0
      - run: npx playwright install chromium webkit --with-deps
      - name: Check exact scope and serve candidate and baseline
        run: |
          git diff --check a36784b55bbcc5f0008b88afb2bbbbdc48c49b6f HEAD
          python3 qa/lucide-icons.py
          node --check qa/lucide-icons.cjs
          nohup python3 qa/server.py >/tmp/icons-http.log 2>&1 &
          mkdir -p /tmp/icons-baseline
          git archive a36784b55bbcc5f0008b88afb2bbbbdc48c49b6f | tar -x -C /tmp/icons-baseline
          nohup python3 -m http.server 8779 --bind 127.0.0.1 --directory /tmp/icons-baseline >/tmp/icons-baseline.log 2>&1 &
      - name: Compare geometry and verify six actions in both browsers
        run: node qa/lucide-icons.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucide-icons-evidence
          path: qa-production/
