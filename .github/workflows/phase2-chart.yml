name: Phase 2 chart precision verification (no publication)
on:
  push:
    branches: [work/phase2-chart-20261126]
  workflow_dispatch:
permissions:
  contents: read
env:
  WEBKIT_SKIA_ENABLE_CPU_RENDERING: '1'
concurrency:
  group: phase2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/work/phase2-chart-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [phase1, panel, overview, zoom, geometry, feedback, recovery]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1 pngjs@7.0.0
      - run: npx playwright install chromium webkit --with-deps
      - name: Check sources and translation master
        run: |
          git diff --check HEAD~1 HEAD
          node --check editor-gestures.js
          python3 tools/export-translations.py translations.xlsx translations.csv --check
      - name: Serve candidate and immutable baselines
        run: |
          nohup python3 qa/server.py >/tmp/phase1-http.log 2>&1 &
          mkdir -p /tmp/phase1-reference/ipa-keyboard /tmp/ipa-vowel-reference
          git archive 1646b6c148f5be0b0f420490b96515fc5839470f | tar -x -C /tmp/phase1-reference/ipa-keyboard
          git archive a389cb2c9f6cae3b00ef75a4795c8aa53bdb858b | tar -x -C /tmp/ipa-vowel-reference
          nohup python3 -m http.server 8775 --bind 127.0.0.1 --directory /tmp/phase1-reference >/tmp/phase1-baseline.log 2>&1 &
          nohup python3 -m http.server 8771 --bind 127.0.0.1 --directory /tmp/ipa-vowel-reference >/tmp/phase1-vowel.log 2>&1 &
      - name: Reproduce baseline and verify three phase 1 requirements
        if: matrix.suite == 'phase1'
        env:
          PHASE1_BASELINE_URL: http://127.0.0.1:8775/ipa-keyboard/
        run: node qa/phase1-display.cjs
      - name: Verify panel controls, gestures and overview
        if: matrix.suite == 'panel'
        run: |
          node qa/panel-controls.cjs
          node qa/editor-gestures.cjs
      - name: Verify overview readability, navigation and freely placed panels
        if: matrix.suite == 'overview'
        run: node qa/floating-overview.cjs
      - name: Verify desktop zoom anchors and controls
        if: matrix.suite == 'zoom'
        run: node qa/desktop-zoom.cjs
      - name: Verify chart geometry and suprasegmental grouping
        if: matrix.suite == 'geometry'
        run: |
          node qa/suprasegmental-grouping.cjs
          node qa/phase2-chart.cjs
      - name: Verify feedback, icons and header
        if: matrix.suite == 'feedback'
        run: |
          node qa/header-alignment.cjs
          node qa/tap-feedback.cjs
          node qa/final-four.cjs
          node qa/viewer-icons.cjs
      - name: Verify recovery, offline upgrade and production assets
        if: matrix.suite == 'recovery'
        run: |
          node qa/recovery.cjs
          node qa/production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-${{ matrix.suite }}-evidence
          path: qa-production/
