name: Diagnose public WebKit slider response
on:
  push:
    branches: [work/panel-perf-probe-20261118]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        prepare: [none, fontconfig, browser-baseline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install webkit --with-deps
      - name: Rebuild system font cache
        if: matrix.prepare == 'fontconfig'
        run: fc-cache --force
      - name: Exercise independent native font baseline
        if: matrix.prepare == 'browser-baseline'
        run: node qa/minimal-font-probe.cjs
        env:
          ISOLATE: system
      - run: node qa/perf-probe.cjs
        env:
          ISOLATE: none
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-slider-performance-trace-${{ matrix.prepare }}
          path: qa-production/
