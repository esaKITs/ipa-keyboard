name: Approved UI release preflight (no publication)
on:
  push:
    branches: [release/ui-20261128]
permissions:
  contents: read
env:
  WEBKIT_SKIA_ENABLE_CPU_RENDERING: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [placement, settings]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1 pngjs@7.0.0
      - run: npx playwright install chromium webkit --with-deps
      - name: Confirm identical approved app and translation catalog
        run: |
          git diff --exit-code 7d7a1a862b55f8284fe5990db40f6f8ce2d3e5ec HEAD -- index.html chart.html translations.csv translations.xlsx third_party
          python3 tools/export-translations.py translations.xlsx translations.csv --check
          nohup python3 qa/server.py >/tmp/release-ui-http.log 2>&1 &
          mkdir -p /tmp/icons-baseline
          git archive a36784b55bbcc5f0008b88afb2bbbbdc48c49b6f | tar -x -C /tmp/icons-baseline
          nohup python3 -m http.server 8779 --bind 127.0.0.1 --directory /tmp/icons-baseline >/tmp/release-ui-baseline.log 2>&1 &
      - name: Verify placement label, icons and header
        if: matrix.suite == 'placement'
        run: |
          node qa/placement-clarity.cjs
          node qa/settings-polish.cjs
      - name: Verify reset and dialog colors
        if: matrix.suite == 'settings'
        run: |
          node qa/settings-reset.cjs
          node qa/dialog-colors.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-release-${{ matrix.suite }}-evidence
          path: qa-production/
