name: Build v0.2.5 local IPA fonts
on:
  push:
    branches: [work/v0.2.5-local-fonts]
    paths: [.github/workflows/build-local-fonts.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.5-local-fonts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official fonts and build static webfonts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'fonttools[woff]' requests
          mkdir -p fonts /tmp/ipa-fonts
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf' -o /tmp/ipa-fonts/NotoSansJP-variable.ttf
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/OFL.txt' -o fonts/OFL-NotoSansJP.txt
          python - <<'PY'
          import requests
          u='https://api.github.com/repos/silnrsi/font-doulos/releases/tags/v7.000'
          r=requests.get(u,timeout=40);r.raise_for_status()
          assets=r.json()['assets']
          z=[a for a in assets if a['name'].lower().endswith('.zip') and 'doulos' in a['name'].lower()]
          assert z, [a['name'] for a in assets]
          data=requests.get(z[0]['browser_download_url'],timeout=90)
          data.raise_for_status()
          open('/tmp/ipa-fonts/doulos.zip','wb').write(data.content)
          PY
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          from pathlib import Path
          import zipfile
          z=zipfile.ZipFile('/tmp/ipa-fonts/doulos.zip')
          names=z.namelist()
          woff=[n for n in names if n.lower().endswith('.woff2') and 'regular' in n.lower() and 'doulos' in n.lower()]
          assert woff, names
          Path('fonts/DoulosSIL-Regular.woff2').write_bytes(z.read(woff[0]))
          ofl=[n for n in names if n.lower().endswith('ofl.txt')]
          assert ofl,names
          Path('fonts/OFL-DoulosSIL.txt').write_bytes(z.read(ofl[0]))
          for weight,label in [(400,'Regular'),(700,'Bold')]:
              f=TTFont('/tmp/ipa-fonts/NotoSansJP-variable.ttf')
              f=instantiateVariableFont(f,{'wght':weight},inplace=True)
              f.flavor='woff2'
              f.save('fonts/NotoSansJP-'+label+'.woff2')
          PY
      - name: Apply font-only CSS and verify invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('weston-chart-preview.html')
          s=p.read_text()
          old="@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');"
          assert s.count(old)==1
          s=s.replace(old,"""@font-face{font-family:'Noto Sans JP Local';src:url('./fonts/NotoSansJP-Regular.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
          @font-face{font-family:'Noto Sans JP Local';src:url('./fonts/NotoSansJP-Bold.woff2') format('woff2');font-style:normal;font-weight:700;font-display:swap}
          @font-face{font-family:'Doulos SIL Local';src:url('./fonts/DoulosSIL-Regular.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}""")
          start=s.index('/* v0.2.4 — typography only;')
          end=s.index('</style>',start)
          s=s[:start]+"""/* v0.2.5 — local fonts only; chart layout, sizes, and scaling unchanged. */
          #chart{font-family:'Noto Sans JP Local',sans-serif}
          #chart h1,#chart h2,#chart th{font-family:'Noto Sans JP Local',sans-serif}
          #chart td,#chart .ipa,#chart .symbol,#chart .phonetic,#chart .vowel{font-family:'Doulos SIL Local',serif}
          #chart .ipa-text-arrow{font-family:'Doulos SIL Local',serif!important}
          """+s[end:]
          assert s.count('>esaKITs v0.2.4<')==1
          s=s.replace('>esaKITs v0.2.4<','>esaKITs v0.2.5<')
          assert 'fonts.googleapis.com' not in s and 'sources.debian.org' not in s
          assert 'var BASE=1040' in s
          for f in Path('fonts').glob('*.woff2'):
              assert f.stat().st_size>10000,(f,f.stat().st_size)
          p.write_text(s)
          PY
      - name: Commit generated fonts and page
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fonts weston-chart-preview.html
          git commit -m 'Build v0.2.5 with bundled licensed Doulos SIL and Noto Sans JP'
          git push origin HEAD:work/v0.2.5-local-fonts
