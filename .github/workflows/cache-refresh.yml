name: Verify production cache refresh
on:
  push:
    branches: [work/production-cache-refresh-20261126]
permissions:
  contents: read
env:
  WEBKIT_SKIA_ENABLE_CPU_RENDERING: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1 pngjs@7.0.0
      - run: npx playwright install chromium webkit --with-deps
      - name: Serve current app and immutable old worker fixture
        run: nohup python3 qa/server.py >/tmp/cache-refresh-http.log 2>&1 &
      - name: Verify warm HTTP cache replacement and offline fallback
        run: node qa/cache-refresh.cjs
      - name: Verify production input and legacy offline upgrades
        run: node qa/production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-cache-refresh-evidence
          path: qa-production/
