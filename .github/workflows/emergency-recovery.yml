name: Emergency recovery diagnosis and regression
on:
  push:
    branches: [work/emergency-recovery-20261118]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ipa-recovery-playwright-1.61.1-ubuntu-latest
      - run: npm install --no-save playwright@1.61.1 pngjs@7.0.0
      - run: npx playwright install chromium webkit --with-deps
      - uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ipa-recovery-playwright-1.61.1-ubuntu-latest
      - name: Serve independent historical snapshots
        run: |
          mkdir -p /tmp/ipa-baselines
          for ref in 3dc0780da a57c319 174f768 1cbba6b a389cb2; do
            mkdir /tmp/ipa-baselines/$ref
            git archive $ref | tar -x -C /tmp/ipa-baselines/$ref
          done
          nohup python3 -m http.server 8770 --bind 127.0.0.1 --directory /tmp/ipa-baselines >/tmp/ipa-baselines.log 2>&1 &
      - run: node qa/recovery-baseline.cjs
      - run: node qa/baseline-panel.cjs
      - name: Verify historical stable core with its original production checks
        run: |
          git show 3dc0780da:qa/production.cjs > qa/recovery-old-production.cjs
          APP_URL=http://127.0.0.1:8770/3dc0780da/ PUBLIC_CHECK=1 node qa/recovery-old-production.cjs
      - name: Serve candidate at production path
        run: nohup python3 qa/server.py >/tmp/ipa-recovery.log 2>&1 &
      - name: Current specification regression in Chromium and WebKit
        run: |
          node qa/panel-controls.cjs
          GEOMETRY_REFERENCE=http://127.0.0.1:8770/a389cb2/ node qa/vowel-equivalence.cjs
          node qa/final-four.cjs
          node qa/recovery.cjs
          node qa/editor-gestures.cjs
          node qa/viewer-icons.cjs
          node qa/production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emergency-recovery-evidence
          path: qa-production/
