name: Verify post-pinch feedback and remaining public regressions
on:
  push:
    branches: [work/zoom-post-pinch-qa-20261127]
permissions:
  contents: read
env:
  WEBKIT_SKIA_ENABLE_CPU_RENDERING: '1'
  APP_URL: https://esakits.github.io/ipa-keyboard/
  PUBLIC_CHECK: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1 pngjs@7.0.0
      - run: npx playwright install chromium webkit --with-deps
      - run: |
          node qa/tap-feedback.cjs
          node qa/final-four.cjs
          node qa/editor-gestures.cjs
          node qa/viewer-icons.cjs
          node qa/production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-pinch-public-evidence
          path: qa-production/
